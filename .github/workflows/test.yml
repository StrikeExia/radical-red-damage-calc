# Validate the Radical Red fork without running Smogon's canonical-data tests,
# whose expected stats, moves, and abilities intentionally differ from this project.

name: Tests

on:
  workflow_run:
    workflows: [Update Sets]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: 18
    - run: npm install
    - name: Build
      run: npm run build
    - name: Lint
      run: npx eslint --no-cache src --ext js

  publish:
    if: ${{ github.repository == 'smogon/damage-calc' && (github.event_name == 'push' || github.event.workflow_run.conclusion == 'success') }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - uses: actions/checkout@v2
    - run: npm install
    - name: Build
      run: node build
    - name: Upload artifact for GitHub Pages
      uses: actions/upload-pages-artifact@v1
      with:
        # Upload entire repository
        path: 'dist'
    - uses: actions/configure-pages@v1
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v1
